events {}

http {
    include /etc/nginx/mime.types;

    server {
        listen 8080;

        # Liveness probe — matching legacy /ping checked by professor dashboard
        location = /ping {
            proxy_pass http://127.0.0.1:8811;
            proxy_set_header Host $http_host;
            proxy_http_version 1.1;
        }

        # Healthcheck — direct to uvicorn without rewriting path
        location = /healthcheck {
            proxy_pass http://127.0.0.1:8811;
            # $host strips the port even when the client sent one (e.g. "localhost:8080"
            # becomes "localhost") — a well-known nginx gotcha, distinct from $http_host.
            # request.url_for() in Jinja templates builds absolute URLs (stylesheet links,
            # etc.) from this Host header, so a stripped port makes the browser resolve
            # them against the wrong port (default 80) and silently fail to load CSS/JS.
            proxy_set_header Host $http_host;
            proxy_http_version 1.1;
        }

        # Readiness — DB-dependent, HTTP 200/503. Short timeouts so a stuck DB probe
        # doesn't hang the caller; matches docs/READINESS.md's contract exactly. NOT used
        # by this container's own Docker HEALTHCHECK (see app/routes/healthcheck.py) —
        # only for external readiness monitoring.
        location = /health {
            proxy_pass http://127.0.0.1:8811;
            proxy_http_version 1.1;
            proxy_connect_timeout 5s;
            proxy_read_timeout 6s;
            proxy_buffering off;
        }

        # Static files — let nginx serve them directly (faster than uvicorn)
        location /static/ {
            alias /app/app/static/;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # All other traffic → uvicorn
        location / {
            proxy_pass http://127.0.0.1:8811;
            # $host strips the port even when the client sent one (e.g. "localhost:8080"
            # becomes "localhost") — a well-known nginx gotcha, distinct from $http_host.
            # request.url_for() in Jinja templates builds absolute URLs (stylesheet links,
            # etc.) from this Host header, so a stripped port makes the browser resolve
            # them against the wrong port (default 80) and silently fail to load CSS/JS.
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # This container's nginx always sees plain HTTP on 127.0.0.1:8080 — $scheme
            # here is therefore always "http", even when an outer reverse proxy (e.g. a
            # host-level nginx/ingress terminating TLS in front of this container, per
            # docker-compose.prod.yml's 127.0.0.1:8112:8080 binding) already set
            # X-Forwarded-Proto: https on its request to us. Overwriting with $scheme
            # would silently discard that signal. Pass through whatever the outer proxy
            # already set; only the outer hop's TLS status is relevant to uvicorn/
            # SessionMiddleware, not this internal one.
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

            proxy_http_version 1.1;
            proxy_read_timeout 120;
        }
    }
}
