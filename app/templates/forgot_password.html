{% extends "sidebar.html" %}

{% block title %}Recuperar senha{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ request.url_for('static', path='css/auth.css') }}">
{% endblock %}

{% block content %}
<section class="card auth-card">
    <h1>Recuperar senha</h1>
    <p class="auth-subtitle">Informe seu e-mail e enviaremos um link para redefinir sua senha.</p>

    {% if message %}
    <div class="form-success">{{ message }}</div>
    {% endif %}

    <form method="post" action="/auth/forgot-password">
        <div class="form-field">
            <label for="forgot-email">E-mail</label>
            <input type="email" id="forgot-email" name="email" required autofocus>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary btn-block">Enviar link de recuperação</button>
        </div>
    </form>

    <p class="auth-footer">
        <a href="/auth/login">Voltar para o login</a>
    </p>
</section>
{% endblock %}
