events {}

http {
    server {
        listen 8080;

        location = /ping {
            proxy_pass http://127.0.0.1:8501/_stcore/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
        }

        location = /health {
            proxy_pass http://127.0.0.1:8502/health;
            proxy_http_version 1.1;
            proxy_connect_timeout 5s;
            proxy_read_timeout 6s;
            proxy_buffering off;
            proxy_intercept_errors on;
            error_page 502 504 = @readiness_unavailable;
        }

        location @readiness_unavailable {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 503 '{"status":"unhealthy","database":"unavailable"}';
        }

        location / {
            proxy_pass http://127.0.0.1:8501;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Necessário para o Streamlit (WebSockets)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }
    }
}
