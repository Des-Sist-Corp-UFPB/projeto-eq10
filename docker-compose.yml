services:
  etl:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    command: ["python", "main.py"]

  dimensoes:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    command: ["python", "send_archives.py"]
    profiles:
      - manual
