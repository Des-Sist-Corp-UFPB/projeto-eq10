services:
  app:
    image: ${IMAGE:-ghcr.io/des-sist-corp-ufpb/projeto-eq10:latest}
    ports:
      - "127.0.0.1:8110:8080"
    networks:
      - eq10-net
    environment:
      # Banco de aplicacao e banco analitico devem vir de .env.prod:
      # AUTH_DATABASE_URL ou AUTH_DB_* para dados gravaveis da aplicacao.
      # AI_DATABASE_URL ou AI_DB_* para DATASUS readonly.
      - ENVIRONMENT=production

      # ── IA (proxy OpenAI-compatível do professor) ─────────────────────────
      - AI_USE_LLM=true
      - AI_LLM_PROVIDER=openai
      - AI_LLM_MODEL=gpt-4o-mini
      - AI_LLM_BASE_URL=https://llm.rodrigor.com/v1
      - AI_FALLBACK_TO_SIMPLE=true

      # OpenTelemetry: valores nao secretos e estaveis ficam versionados.
      # Endpoint institucional e Authorization=Bearer <token> ficam
      # exclusivamente no .env.prod protegido do servidor.
      - OTEL_ENABLED=true
      - OTEL_SERVICE_NAME=dsc-eq10
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=dsc,deployment.environment=production
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_EXPORTER_OTLP_TIMEOUT=10000

      # Umami usa somente configuracao publica do tracker; nao usa credenciais
      # do painel. Valores podem ser sobrescritos pelo .env.prod.
      - UMAMI_ENABLED=${UMAMI_ENABLED:-true}
      - UMAMI_SCRIPT_URL=${UMAMI_SCRIPT_URL:-https://umami.dsc.rodrigor.com/script.js}
      - UMAMI_WEBSITE_ID=${UMAMI_WEBSITE_ID:-339ab59d-d201-4b26-a7e5-e642385064f5}
      - UMAMI_HOST_URL=${UMAMI_HOST_URL:-https://umami.dsc.rodrigor.com}
      - UMAMI_ALLOWED_DOMAIN=${UMAMI_ALLOWED_DOMAIN:-eq10.dsc.rodrigor.com}

    env_file:
      - .env.prod
    restart: always

  etl:
    image: ${IMAGE:-ghcr.io/des-sist-corp-ufpb/projeto-eq10:latest}
    networks:
      - eq10-net
    environment:
      # Credenciais de ETL devem vir de .env.prod, sem valores reais neste arquivo.
      - ENVIRONMENT=production

    env_file:
      - .env.prod
    volumes:
      - etl-data:/app/data
    command: ["python", "main.py"]
    # O ETL roda uma vez e sai — não usa restart:always
    restart: "no"
    profiles:
      # Execute manualmente com: docker compose --profile etl up etl
      - etl

networks:
  eq10-net:
    external: true
    name: projeto-eq10_default   # ajuste se a rede do professor tiver outro nome

volumes:
  etl-data:
