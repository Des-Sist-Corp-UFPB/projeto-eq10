name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build, push e deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Prepara nome da imagem (lowercase)
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):latest" >> $GITHUB_ENV

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.chat
          push: true
          tags: ${{ env.IMAGE }}

      - name: Deploy no servidor
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE: ${{ env.IMAGE }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          host: dsc.rodrigor.com
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          envs: IMAGE,OPENROUTER_API_KEY
          script: |
            # Cria o docker-compose.prod.yml diretamente no servidor
            cat << 'EOF' > docker-compose.prod.yml
            services:
              app:
                image: ${IMAGE}
                ports:
                  - "127.0.0.1:8110:8501"
                environment:
                  - AI_DB_HOST=postgres
                  - AI_DB_USER=eq10
                  - AI_DB_PASSWORD=9eHKqhJIJGUy4ZjDStWQ
                  - AI_DB_NAME=eq10
                  - AI_USE_LLM=true
                  - AI_LLM_PROVIDER=openrouter
                  - AI_LLM_MODEL=openrouter/openrouter/free
                env_file:
                  - .env.prod
                restart: always
            EOF
            
            # Cria o arquivo de ambiente para o container
            echo "IMAGE=${IMAGE}" > .env.prod
            echo "OPENROUTER_API_KEY=${OPENROUTER_API_KEY}" >> .env.prod
            
            # Puxa a nova imagem e sobe a aplicacao
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
