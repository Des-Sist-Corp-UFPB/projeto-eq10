name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build, push e deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Prepara nome da imagem (lowercase)
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):latest" >> $GITHUB_ENV

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configura Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.chat
          push: true
          load: true
          tags: ${{ env.IMAGE }}

      - name: Valida startup real do container
        run: |
          set -Eeuo pipefail
          python scripts/smoke_test_startup_container.py "${IMAGE}"
          touch .env.prod
          docker compose -f docker-compose.prod.yml --env-file .env.prod config --quiet
          rm -f .env.prod

      - name: Deploy no servidor
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Envia "actor:token" ao servidor. A chave é travada (command=),
          # então o servidor usa esse token efêmero só para puxar a imagem do GHCR.
          for attempt in 1 2 3; do
            echo "Deploy attempt ${attempt}/3..."
            echo "Pulling image on remote server and applying deploy..."

            if ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
              "${{ secrets.SSH_USERNAME }}@dsc.rodrigor.com" \
              "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}"; then
              echo "Deploy completed."
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Deploy failed after 3 attempts."
              exit 1
            fi

            wait_seconds=$((attempt * 10))
            echo "Deploy failed. Retrying in ${wait_seconds} seconds..."
            sleep "$wait_seconds"
          done

      - name: Verifica saude publica da aplicacao
        env:
          APP_HEALTH_URL: ${{ vars.APP_HEALTH_URL }}
          DEPLOY_HEALTH_TIMEOUT_SECONDS: "120"
          DEPLOY_HEALTH_INTERVAL_SECONDS: "5"
          DEPLOY_HEALTH_REQUEST_TIMEOUT_SECONDS: "5"
        run: python scripts/verify_deploy_health.py

      - name: Solicita diagnosticos seguros no servidor
        if: failure()
        continue-on-error: true
        run: |
          set -Eeuo pipefail

          if [ ! -f ~/.ssh/deploy_key ]; then
            echo "Deploy SSH key unavailable; cannot request safe server diagnostics."
            exit 0
          fi

          echo "Requesting safe server diagnostics via deploy SSH forced command."
          echo "Expected server-side diagnostics: compose ps, app logs tail, app state, app cmd, app entrypoint."

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${{ secrets.SSH_USERNAME }}@dsc.rodrigor.com" \
            "diagnostics" || echo "Safe server diagnostics command unavailable or failed."
