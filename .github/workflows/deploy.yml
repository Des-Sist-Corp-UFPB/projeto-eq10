name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build, push e deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.chat
          push: true
          tags: ghcr.io/des-sist-corp-ufpb/projeto-eq10:latest

      - name: Deploy no servidor
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE: ghcr.io/des-sist-corp-ufpb/projeto-eq10:latest
          AI_DB_USER: ${{ vars.AI_DB_USER }}
          AI_DB_PASSWORD: ${{ secrets.AI_DB_PASSWORD }}
          AI_DB_HOST: ${{ vars.AI_DB_HOST }}
          AI_DB_NAME: ${{ vars.AI_DB_NAME }}
          AI_USE_LLM: ${{ vars.AI_USE_LLM }}
          AI_FALLBACK_TO_SIMPLE: ${{ vars.AI_FALLBACK_TO_SIMPLE }}
          AI_LLM_PROVIDER: ${{ vars.AI_LLM_PROVIDER }}
          AI_LLM_MODEL: ${{ vars.AI_LLM_MODEL }}
          AI_LLM_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_DEBUG_SAFE: ${{ vars.AI_DEBUG_SAFE }}
        with:
          host: dsc.rodrigor.com
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          envs: IMAGE,AI_DB_USER,AI_DB_PASSWORD,AI_DB_HOST,AI_DB_NAME,AI_USE_LLM,AI_FALLBACK_TO_SIMPLE,AI_LLM_PROVIDER,AI_LLM_MODEL,AI_LLM_API_KEY,AI_DEBUG_SAFE
          script: |
            echo "Deploy solicitado para imagem:"
            echo "$IMAGE"
