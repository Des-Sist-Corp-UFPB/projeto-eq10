[theme]
# Keep deployed Streamlit on a light base theme. Widget-specific polish is scoped in src/ui/styles.py.
base = "light"
primaryColor = "#6D28D9"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#111827"
font = "sans serif"
# Keep dataframe headers/toolbars readable on deployments that inherit browser/system dark styling.
dataframeHeaderBackgroundColor = "#FFFFFF"
dataframeBorderColor = "#E2E8F0"
